    licence: CC BY 4.0 icgc.cat
    formats: [wms]
    tags: [orthophoto, crs, wms, "2025"]
    layers:
      - name: ortofoto_25cm_color_2025
        title: Ortofoto Territorial 2025
        geometry: raster
        crs: EPSG:25831
