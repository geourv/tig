<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Una torre moguda: geometries independents o trams derivats</title>
<desc id="desc">La torre T2 canvia de posició. En una capa independent les línies romanen al lloc anterior. Amb extrems referenciats per identificador i una regla de reconstrucció, els trams T1–T2 i T2–T3 acompanyen T2.</desc>
<rect width="1200" height="650" fill="#ffffff"/>
<g font-family="Arial, Liberation Sans, sans-serif" font-size="28" fill="#21313c">
<text x="35" y="42" text-anchor="start" font-weight="700">Posició inicial</text>
<polyline points="340,155 600,155 860,155" fill="none" stroke="#176486" stroke-width="6" stroke-dasharray=""/>
<circle cx="340" cy="155" r="12" fill="#e7b65b" stroke="#6c501d" stroke-width="3"/>
<text x="340" y="131" text-anchor="middle" font-weight="400">T1</text>
<circle cx="600" cy="155" r="12" fill="#e7b65b" stroke="#6c501d" stroke-width="3"/>
<text x="600" y="131" text-anchor="middle" font-weight="400">T2</text>
<circle cx="860" cy="155" r="12" fill="#e7b65b" stroke="#6c501d" stroke-width="3"/>
<text x="860" y="131" text-anchor="middle" font-weight="400">T3</text>
<text x="470" y="202" text-anchor="middle" font-weight="400">L1</text>
<text x="730" y="202" text-anchor="middle" font-weight="400">L2</text>
<path d="M600,234 L600,278 M600,278 L585,263 M600,278 L615,263" fill="none" stroke="#71828b" stroke-width="3"/>
<text x="628" y="265" text-anchor="start" font-weight="400">es mou T2</text>
<line x1="600" y1="320" x2="600" y2="580" stroke="#c5d0d5" stroke-width="2"/>
<text x="35" y="332" text-anchor="start" font-weight="700">Geometries independents</text>
<text x="635" y="332" text-anchor="start" font-weight="700">Extrems vinculats a les torres</text>
<polyline points="90,500 300,500 510,500" fill="none" stroke="#176486" stroke-width="6" stroke-dasharray=""/>
<circle cx="300" cy="500" r="18" fill="#ffffff" stroke="#b44c3b" stroke-width="4"/>
<path d="M300,480 L300,432 M300,432 l-9,13 m9,-13 l9,13" fill="none" stroke="#b44c3b" stroke-width="3"/>
<circle cx="90" cy="500" r="12" fill="#e7b65b" stroke="#6c501d" stroke-width="3"/>
<text x="90" y="476" text-anchor="middle" font-weight="400">T1</text>
<circle cx="300" cy="408" r="12" fill="#e7b65b" stroke="#6c501d" stroke-width="3"/>
<text x="300" y="384" text-anchor="middle" font-weight="400">T2</text>
<circle cx="510" cy="500" r="12" fill="#e7b65b" stroke="#6c501d" stroke-width="3"/>
<text x="510" y="476" text-anchor="middle" font-weight="400">T3</text>
<text x="300" y="557" text-anchor="middle" font-weight="400">trams desconnectats</text>
<polyline points="690,500 900,500 1110,500" fill="none" stroke="#acb8bd" stroke-width="6" stroke-dasharray="7 7"/>
<polyline points="690,500 900,408" fill="none" stroke="#176486" stroke-width="6" stroke-dasharray=""/>
<polyline points="900,408 1110,500" fill="none" stroke="#176486" stroke-width="6" stroke-dasharray=""/>
<path d="M900,480 L900,432 M900,432 l-9,13 m9,-13 l9,13" fill="none" stroke="#b44c3b" stroke-width="3"/>
<circle cx="690" cy="500" r="12" fill="#e7b65b" stroke="#6c501d" stroke-width="3"/>
<text x="690" y="476" text-anchor="middle" font-weight="400">T1</text>
<circle cx="900" cy="408" r="12" fill="#e7b65b" stroke="#6c501d" stroke-width="3"/>
<text x="900" y="384" text-anchor="middle" font-weight="400">T2</text>
<circle cx="1110" cy="500" r="12" fill="#e7b65b" stroke="#6c501d" stroke-width="3"/>
<text x="1110" y="476" text-anchor="middle" font-weight="400">T3</text>
<text x="900" y="557" text-anchor="middle" font-weight="400">trams reconstruïts</text>
<text x="440" y="622" text-anchor="middle" font-weight="400">L1 : T1 → T2</text>
<text x="760" y="622" text-anchor="middle" font-weight="400">L2 : T2 → T3</text>
</g>
</svg>
