<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Errors topològics habituals durant la captura vectorial</title>
  <desc id="desc">Quatre panells comparen una escletxa entre polígons, un solapament, dos extrems de xarxa que no coincideixen i un cas correcte amb frontera compartida i node connectat.</desc>
  <defs>
    <style>
      text { font-family: Arial, 'Liberation Sans', sans-serif; }
      .panel { fill: #ffffff; stroke: #c5d0d5; stroke-width: 2; }
      .heading { fill: #23343d; font-size: 34px; font-weight: 700; }
      .note { fill: #53656e; font-size: 29px; }
      .area-a { fill: #87b8cc; fill-opacity: .48; stroke: #176486; stroke-width: 5; }
      .area-b { fill: #e4aa75; fill-opacity: .48; stroke: #a9572f; stroke-width: 5; }
      .error { fill: #c84232; fill-opacity: .66; stroke: #a3281d; stroke-width: 3; }
      .line { fill: none; stroke: #176486; stroke-width: 11; stroke-linecap: butt; }
      .good { fill: #2f875f; stroke: #ffffff; stroke-width: 4; }
      .bad { fill: #c84232; stroke: #ffffff; stroke-width: 4; }
      .shared { fill: none; stroke: #2f875f; stroke-width: 8; }
      .guide { fill: none; stroke: #7f8d93; stroke-width: 2; stroke-dasharray: 9 8; }
    </style>
  </defs>
  <rect width="1500" height="820" fill="#f7f9fa"/>
  <rect x="25" y="25" width="715" height="370" class="panel"/>
  <rect x="760" y="25" width="715" height="370" class="panel"/>
  <rect x="25" y="420" width="715" height="370" class="panel"/>
  <rect x="760" y="420" width="715" height="370" class="panel"/>
  <text x="60" y="78" class="heading">Escletxa entre polígons</text>
  <polygon points="85,125 365,125 350,340 85,340" class="area-a"/>
  <polygon points="383,125 680,125 680,340 368,340" class="area-b"/>
  <polygon points="365,125 383,125 368,340 350,340" class="error"/>
  <text x="374" y="365" text-anchor="middle" class="note">buit no assignat</text>
  <text x="795" y="78" class="heading">Solapament en una partició</text>
  <polygon points="820,125 1115,125 1135,340 820,340" class="area-a"/>
  <polygon points="1085,125 1440,125 1440,340 1065,340" class="area-b"/>
  <polygon points="1085,125 1115,125 1135,340 1065,340" class="error"/>
  <text x="1100" y="365" text-anchor="middle" class="note">superfície comptada dues vegades</text>
  <text x="60" y="473" class="heading">Extrems sense ajustar</text>
  <path d="M 90,650 L 330,650" class="line"/>
  <path d="M 355,650 L 670,545" class="line"/>
  <circle cx="330" cy="650" r="13" class="bad"/>
  <circle cx="355" cy="650" r="13" class="bad"/>
  <line x1="330" y1="610" x2="355" y2="610" class="guide"/>
  <text x="342" y="590" text-anchor="middle" class="note">distància petita ≠ connexió</text>
  <text x="795" y="473" class="heading">Relacions comprovades</text>
  <polygon points="805,515 1090,515 1090,720 805,720" class="area-a"/>
  <polygon points="1090,515 1445,515 1445,720 1090,720" class="area-b"/>
  <line x1="1090" y1="515" x2="1090" y2="720" class="shared"/>
  <path d="M 875,665 L 1255,665 L 1370,570" class="line"/>
  <path d="M 1255,665 L 1355,710" class="line"/>
  <circle cx="1255" cy="665" r="14" class="good"/>
  <text x="1255" y="765" text-anchor="middle" class="note">frontera única i node exacte</text>
</svg>
