<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450" role="img" aria-labelledby="title desc">
  <title id="title">Un gradient local determina el pendent i l’orientació</title>
  <desc id="desc">Una graella de nou elevacions separades vint-i-cinc metres mostra el màxim descens cap al sud-est. El gradient calculat produeix un pendent de 10,1 graus, equivalent al 17,9 per cent, i una orientació de 153,4 graus des del nord. Una comparació final distingeix una cel·la plana de NoData.</desc>
  <defs>
    <style>
      text { font-family: Arial, 'Liberation Sans', sans-serif; }
      .heading { fill: #21313c; font-size: 40px; font-weight: 700; }
      .label { fill: #344851; font-size: 30px; }
      .key { fill: #176486; font-size: 32px; font-weight: 700; }
      .direction-label { fill: #ad5a35; font-size: 30px; font-weight: 700; }
      .value { fill: #1f333c; font-size: 34px; font-weight: 700; }
      .value-light { fill: #ffffff; font-size: 34px; font-weight: 700; }
      .grid-cell { stroke: #ffffff; stroke-width: 4; }
      .centre-cell { stroke: #ad5a35; stroke-width: 7; }
      .direction { fill: none; stroke: #ad5a35; stroke-width: 7; marker-end: url(#arrow-orange); }
      .aspect-arc { fill: none; stroke: #176486; stroke-width: 5; marker-end: url(#arrow-blue); }
      .angle-sector { fill: #c5dfe6; fill-opacity: 0.55; stroke: #176486; stroke-width: 4; }
      .axis { fill: none; stroke: #647780; stroke-width: 4; }
      .guide { fill: none; stroke: #91a1a8; stroke-width: 3; stroke-dasharray: 9 8; }
      .profile { fill: none; stroke: #ad5a35; stroke-width: 7; marker-end: url(#arrow-orange); }
      .divider { stroke: #c5d0d5; stroke-width: 2; }
      .flat { fill: #dcebef; stroke: #7f939c; stroke-width: 3; }
      .nodata { fill: url(#diagonal); stroke: #7f939c; stroke-width: 3; }
    </style>
    <marker id="arrow-orange" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 20">
      <path d="M0,0 L0,20 L20,10 z" fill="#ad5a35"/>
    </marker>
    <marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 18">
      <path d="M0,0 L0,18 L18,9 z" fill="#176486"/>
    </marker>
    <pattern id="diagonal" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#eef1f2"/>
      <line x1="0" y1="0" x2="0" y2="18" stroke="#9ba9af" stroke-width="7"/>
    </pattern>
  </defs>
  <rect width="1000" height="1450" fill="#f7f9fa"/>
  <line x1="45" y1="760" x2="955" y2="760" class="divider"/>
  <line x1="45" y1="1170" x2="955" y2="1170" class="divider"/>
  <text x="340" y="58" text-anchor="middle" class="heading">Gradient local en planta</text>
  <rect x="70" y="105" width="180" height="180" fill="#39778e" class="grid-cell"/>
  <text x="160.0" y="207.0" text-anchor="middle" class="value-light">128 m</text>
  <rect x="250" y="105" width="180" height="180" fill="#5d99ad" class="grid-cell"/>
  <text x="340.0" y="207.0" text-anchor="middle" class="value-light">126 m</text>
  <rect x="430" y="105" width="180" height="180" fill="#83b7c7" class="grid-cell"/>
  <text x="520.0" y="207.0" text-anchor="middle" class="value">124 m</text>
  <rect x="70" y="285" width="180" height="180" fill="#83b7c7" class="grid-cell"/>
  <text x="160.0" y="387.0" text-anchor="middle" class="value">124 m</text>
  <rect x="250" y="285" width="180" height="180" fill="#a7ced9" class="centre-cell"/>
  <text x="340.0" y="339.0" text-anchor="middle" class="value">122 m</text>
  <rect x="430" y="285" width="180" height="180" fill="#c5dfe6" class="grid-cell"/>
  <text x="520.0" y="387.0" text-anchor="middle" class="value">120 m</text>
  <rect x="70" y="465" width="180" height="180" fill="#c5dfe6" class="grid-cell"/>
  <text x="160.0" y="567.0" text-anchor="middle" class="value">120 m</text>
  <rect x="250" y="465" width="180" height="180" fill="#dcebef" class="grid-cell"/>
  <text x="340.0" y="567.0" text-anchor="middle" class="value">118 m</text>
  <rect x="430" y="465" width="180" height="180" fill="#edf4f6" class="grid-cell"/>
  <text x="520.0" y="567.0" text-anchor="middle" class="value">116 m</text>
  <line x1="340.0" y1="375.0" x2="425.0" y2="544.9" class="direction"/>
  <path d="M 340.0 270.0 A 105 105 0 0 1 387.0 468.9" class="aspect-arc"/>
  <line x1="790" y1="245" x2="790" y2="135" class="axis" marker-end="url(#arrow-blue)"/>
  <text x="790" y="110" text-anchor="middle" class="key">N</text>
  <text x="665" y="325" class="key">aspecte = 153,4°</text>
  <text x="665" y="450" class="direction-label">direcció de</text>
  <text x="665" y="490" class="direction-label">màxim descens</text>
  <line x1="70" y1="690" x2="250" y2="690" class="axis"/>
  <line x1="70" y1="677" x2="70" y2="703" class="axis"/>
  <line x1="250" y1="677" x2="250" y2="703" class="axis"/>
  <text x="160.0" y="735" text-anchor="middle" class="label">25 m</text>
  <text x="360" y="710" class="label">dz/dx = -0,08</text>
  <text x="660" y="710" class="label">dz/dy = +0,16</text>
  <text x="500" y="815" text-anchor="middle" class="heading">Perfil en el màxim descens</text>
  <line x1="115" y1="925" x2="715.0" y2="925" class="guide"/>
  <line x1="715.0" y1="925" x2="715.0" y2="1032.3" class="guide"/>
  <path d="M 115 925 L 250 925 A 135 135 0 0 1 247.9 948.8 Z" class="angle-sector"/>
  <line x1="115" y1="925" x2="715.0" y2="1032.3" class="profile"/>
  <text x="415.0" y="880" text-anchor="middle" class="label">distància horitzontal = 50 m</text>
  <text x="745.0" y="988.7" class="label">Δz = −8,94 m</text>
  <text x="115" y="905" text-anchor="middle" class="label">122,00 m</text>
  <text x="715.0" y="1080" text-anchor="middle" class="label">113,06 m</text>
  <text x="275" y="1005" class="key">10,1°</text>
  <text x="285" y="1135" text-anchor="middle" class="key">pendent = 10,1° = 17,9 %</text>
  <text x="770" y="1135" text-anchor="middle" class="label">mòdul del gradient = 0,179</text>
  <rect x="45" y="1265" width="52" height="52" class="flat"/>
  <rect x="97" y="1265" width="52" height="52" class="flat"/>
  <rect x="149" y="1265" width="52" height="52" class="flat"/>
  <rect x="45" y="1317" width="52" height="52" class="flat"/>
  <rect x="97" y="1317" width="52" height="52" class="flat"/>
  <rect x="149" y="1317" width="52" height="52" class="flat"/>
  <rect x="45" y="1369" width="52" height="52" class="flat"/>
  <rect x="97" y="1369" width="52" height="52" class="flat"/>
  <rect x="149" y="1369" width="52" height="52" class="flat"/>
  <line x1="515" y1="1195" x2="515" y2="1430" class="divider"/>
  <text x="123.0" y="1354" text-anchor="middle" class="key">120 m</text>
  <text x="40" y="1208" class="key">Cel·la plana:</text>
  <text x="40" y="1245" class="key">dada vàlida</text>
  <text x="205" y="1277" class="label">pendent = 0°;</text>
  <text x="205" y="1309" class="label">sense aspecte</text>
  <text x="205" y="1341" class="label">estable</text>
  <text x="205" y="1373" class="label">un llindar justificat</text>
  <text x="205" y="1405" class="label">en separa les</text>
  <text x="205" y="1437" class="label">gairebé planes</text>
  <rect x="545" y="1265" width="156" height="156" class="nodata"/>
  <text x="623" y="1354" text-anchor="middle" class="key">NoData</text>
  <text x="545" y="1245" class="key">Valor absent</text>
  <text x="720" y="1277" class="label">no s’avaluen ni</text>
  <text x="720" y="1309" class="label">pendent ni</text>
  <text x="720" y="1341" class="label">aspecte</text>
  <text x="720" y="1373" class="label">no equival a una</text>
  <text x="720" y="1405" class="label">superfície plana</text>
</svg>
