<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="selection-title selection-desc">
  <title id="selection-title">Selecció, retall i intersecció de les mateixes geometries</title>
  <desc id="selection-desc">Comparació en tres columnes d’una línia A que travessa un polígon B. La selecció o extracció conserva tota la línia A i els seus atributs; el retall conserva A intersecció B i els atributs d’A; la intersecció conserva la mateixa part comuna i combina els atributs d’A i B.</desc>
  <defs>
    <style>
      text { font-family: Arial, 'Liberation Sans', sans-serif; }
      .heading { font-size: 27px; font-weight: 700; fill: #17252d; }
      .layer { font-size: 24px; font-weight: 700; }
      .key { font-size: 24px; fill: #55656d; }
      .value { font-size: 24px; font-weight: 700; fill: #17252d; }
      .rule { stroke: #bdc8cd; stroke-width: 1.5; }
      .mask { fill: #a9d3e4; fill-opacity: .55; stroke: #2878a5; stroke-width: 2.5; }
      .mask-context { fill: #dcebf1; fill-opacity: .35; stroke: #7896a4; stroke-width: 2; stroke-dasharray: 7 6; }
      .source { fill: none; stroke: #c75038; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .source-context { fill: none; stroke: #9aa8af; stroke-width: 5; stroke-linecap: round; }
      .result { fill: none; stroke: #a93422; stroke-width: 9; stroke-linecap: round; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L9,3.5 z" fill="#52616b"/>
    </marker>
    <clipPath id="result-clip-0">
      <polygon points="125,330 330,346 300,450 145,462"/>
    </clipPath>
    <clipPath id="result-clip-1">
      <polygon points="525,330 730,346 700,450 545,462"/>
    </clipPath>
    <clipPath id="result-clip-2">
      <polygon points="925,330 1130,346 1100,450 945,462"/>
    </clipPath>
  </defs>
  <line x1="400" y1="18" x2="400" y2="572" class="rule"/>
  <line x1="800" y1="18" x2="800" y2="572" class="rule"/>
  <text x="200" y="43" text-anchor="middle" class="heading">Selecció / extracció</text>
  <line x1="40" y1="62" x2="360" y2="62" class="rule"/>
  <polygon points="125,110 330,126 300,230 145,242" class="mask"/>
  <path d="M 54,218 C 142,205 235,126 362,148" class="source"/>
  <text x="68" y="198" class="layer" fill="#9d3625">A</text>
  <text x="284" y="174" class="layer" fill="#1f668a">B</text>
  <line x1="200" y1="266" x2="200" y2="305" stroke="#52616b" stroke-width="3" marker-end="url(#arrow)"/>
  <polygon points="125,330 330,346 300,450 145,462" class="mask-context"/>
  <path d="M 54,438 C 142,425 235,346 362,368" class="result"/>
  <line x1="40" y1="490" x2="360" y2="490" class="rule"/>
  <text x="40" y="526" class="key">Geometria</text>
  <text x="360" y="526" text-anchor="end" class="value">A completa</text>
  <text x="40" y="562" class="key">Atributs</text>
  <text x="360" y="562" text-anchor="end" class="value">A</text>
  <text x="600" y="43" text-anchor="middle" class="heading">Retall (clip)</text>
  <line x1="440" y1="62" x2="760" y2="62" class="rule"/>
  <polygon points="525,110 730,126 700,230 545,242" class="mask"/>
  <path d="M 454,218 C 542,205 635,126 762,148" class="source"/>
  <text x="468" y="198" class="layer" fill="#9d3625">A</text>
  <text x="684" y="174" class="layer" fill="#1f668a">B</text>
  <line x1="600" y1="266" x2="600" y2="305" stroke="#52616b" stroke-width="3" marker-end="url(#arrow)"/>
  <polygon points="525,330 730,346 700,450 545,462" class="mask-context"/>
  <path d="M 454,438 C 542,425 635,346 762,368" class="source-context"/>
  <path d="M 454,438 C 542,425 635,346 762,368" class="result" clip-path="url(#result-clip-1)"/>
  <line x1="440" y1="490" x2="760" y2="490" class="rule"/>
  <text x="440" y="526" class="key">Geometria</text>
  <text x="760" y="526" text-anchor="end" class="value">A ∩ B</text>
  <text x="440" y="562" class="key">Atributs</text>
  <text x="760" y="562" text-anchor="end" class="value">A</text>
  <text x="1000" y="43" text-anchor="middle" class="heading">Intersecció</text>
  <line x1="840" y1="62" x2="1160" y2="62" class="rule"/>
  <polygon points="925,110 1130,126 1100,230 945,242" class="mask"/>
  <path d="M 854,218 C 942,205 1035,126 1162,148" class="source"/>
  <text x="868" y="198" class="layer" fill="#9d3625">A</text>
  <text x="1084" y="174" class="layer" fill="#1f668a">B</text>
  <line x1="1000" y1="266" x2="1000" y2="305" stroke="#52616b" stroke-width="3" marker-end="url(#arrow)"/>
  <polygon points="925,330 1130,346 1100,450 945,462" class="mask-context"/>
  <path d="M 854,438 C 942,425 1035,346 1162,368" class="source-context"/>
  <path d="M 854,438 C 942,425 1035,346 1162,368" class="result" clip-path="url(#result-clip-2)"/>
  <line x1="840" y1="490" x2="1160" y2="490" class="rule"/>
  <text x="840" y="526" class="key">Geometria</text>
  <text x="1160" y="526" text-anchor="end" class="value">A ∩ B</text>
  <text x="840" y="562" class="key">Atributs</text>
  <text x="1160" y="562" text-anchor="end" class="value">A + B</text>
</svg>
