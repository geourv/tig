    "source_prompt": "Necessito vint-i-una captures de QGIS en catal\u00e0. Els mapes han de mostrar el\ncanvi de suport entre els MDT25 i MDT200 oficials i els resultats de pendent,\norientaci\u00f3 i llindars topogr\u00e0fics sobre Vila-seca. Les captures did\u00e0ctiques\nhan de conservar el context de la interf\u00edcie, separar les rutes de men\u00fa dels\ndi\u00e0legs i explicar Combinar, Retallar per capa de m\u00e0scara, les dues\ncalculadores r\u00e0ster, la vectoritzaci\u00f3 de les zones situades per sota de 2 m,\nla proximitat, la comparaci\u00f3 amb un buffer i les estad\u00edstiques zonals.\n",
