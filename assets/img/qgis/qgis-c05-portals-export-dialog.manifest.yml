    "source_prompt": "Localitzar Vila-seca manualment a la capa CNIG i seleccionar-lo amb un clic.\nMostrar el clic dret sobre la capa activa i ressaltar Filtre. Mostrar la\nconsulta provincial sense duplicar-la en un bloc de codi al manual.\nComparar els filtres de taula: seleccionats, visibles i expressi\u00f3.\nMostrar eines i modificadors, i acabar amb el men\u00fa i el di\u00e0leg natius de\nselecci\u00f3 per expressi\u00f3. Continuar amb portals, illes i transport del CNIG.\nMostrar les seleccions espacials al mapa i exportar-les realment, amb els\ndi\u00e0legs natius, al GeoPackage existent. Les illes contingudes es representen\namb farciment. Portals, illes i viari mostren el terme municipal complet amb\nel mateix enquadrament de refer\u00e8ncia. El viari se centra en autovies i autopistes.\nAcabar amb crear/actualitzar camps, tipus de dades i ajuda d'aggregate.\nL'actor capture_pr3_guided.py prepara cada estat natiu i executa les accions;\nel bridge instal\u00b7lat d'unaltracaptura 0.3.0 captura i anota aquell estat.\n",
