    path: prepared/cnig/mdt25/source/pnoa_mdt25_etrs89_hu31_0472_lid.tif
    sha256: 325b8028bc99d4726cfdd9cb777de0ac06ed815a62da2b0e313c0c17daf4bb7c
  - id: cnig-mdt25-0473
    type: raster
    path: prepared/cnig/mdt25/source/pnoa_mdt25_etrs89_hu31_0473_lid.tif
    sha256: 827b2a41b61a9636178847137647fb46f07d4f227165279d1487e757921f22bf
  - id: cnig-mdt200-tarragona
