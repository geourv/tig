id: qgis-terrain-analysis
title: Relleu i derivats ràster de Vila-seca
source_prompt: |
  Necessito vint-i-una captures de QGIS en català. Els mapes han de mostrar el
  canvi de suport entre els MDT25 i MDT200 oficials i els resultats de pendent,
  orientació i llindars topogràfics sobre Vila-seca. Les captures didàctiques
  han de conservar el context de la interfície, separar les rutes de menú dels
  diàlegs i explicar Combinar, Retallar per capa de màscara, les dues
  calculadores ràster, la vectorització de les zones situades per sota de 2 m,
  la proximitat, la comparació amb un buffer i les estadístiques zonals.

runtime:
  image: qgis/qgis@sha256:e016b5296b99f0b07760b883888bc4ba615c0099feae9432374b4c83e8e073cc
  locale: ca_ES

compat:
  qgis: "==3.44.11"

plugins:
  - processing

