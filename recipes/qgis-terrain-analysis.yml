setup:
  - action: trigger_action
    name: mActionNewProject
  - action: close_transients
  - action: clear_message_bar
  - action: set_project_crs
    auth_id: EPSG:25831
  - action: show_panel
    title: Layers
  - action: hide_panel
    title: Browser

captures:
  - id: mdt200-orthophoto
    title: El MDT200 sobre l'ortofoto de Vila-seca
    mode: window
    layout_policy: &layout_policy
      reading_direction: left_to_right
      prefer_local_empty_space: true
      prefer_leaderless_labels: true
      avoid_diagonal_leaders: true
      allow_diagonal_leaders: when_no_clear_local_candidate
      protect_text: true
      protect_controls: true
    steps:
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/terrain/vila-seca/ortofoto_territorial_2025_vila_seca.tif
        name: Ortofoto Territorial ICGC 2025
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/terrain/vila-seca/mdt200_vila_seca.tif
        name: MDT200 Vila-seca · 200 m
      - action: style_raster
        layer: MDT200 Vila-seca · 200 m
        nodata: -32767
        minimum: 0
        maximum: 80
        palette: terrain
        opacity: 0.55
        unit: m
      - action: load_vector
        path: assets/projectes/vila-seca/dades_preparades/projecte_tig.gpkg|layername=municipi_treball
        name: Límit de Vila-seca
      - action: style_layer
        layer: Límit de Vila-seca
        color: "#8f2d56"
        fill_color: "#ffffff"
        fill_opacity: 0
        outline_width: 1.2
      - action: zoom_to_layer
        layer: Límit de Vila-seca
        scale: 1.0
      - action: wait
        ms: 200
      - action: set_canvas_scale
        scale: 40000
      - action: expand_tree_item
        item_text: MDT200 Vila-seca · 200 m
      - action: select_layer
        layer: MDT200 Vila-seca · 200 m
      - action: wait
        ms: 800
    target: &main_window
      class_name: QgisApp
      fallback:
        - class_name: QMainWindow
    drawings: []
    output:
      path: assets/img/qgis/qgis-raster-mdt200-orthophoto.png
      annotations_svg: assets/img/qgis/qgis-raster-mdt200-orthophoto.annotations.svg
      manifest: assets/img/qgis/qgis-raster-mdt200-orthophoto.manifest.yml

  - id: merge-menu
    title: Ruta de menú per combinar els MDT25
    mode: window
    layout_policy: *layout_policy
    steps:
      - action: close_transients
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/cnig/mdt25/source/pnoa_mdt25_etrs89_hu31_0473_lid.tif
        name: MDT25 full 0473
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/cnig/mdt25/source/pnoa_mdt25_etrs89_hu31_0472_lid.tif
        name: MDT25 full 0472
      - action: show_panel
        title: Layers
      - action: open_menu_path
        path:
          - Ràster
          - Miscellaneous
          - Combina…
      - action: wait
        ms: 500
    target: *main_window
    drawings:
      - type: callout
        text: Acció Combina
        colour: auto
        number: none
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: true
        target:
          class_name: QAction
          text: Combina
    output:
      path: assets/img/qgis/qgis-raster-merge-menu.png
      annotations_svg: assets/img/qgis/qgis-raster-merge-menu.annotations.svg
      manifest: assets/img/qgis/qgis-raster-merge-menu.manifest.yml

  - id: merge-dialog
    title: Combinar dues tessel·les MDT25
    mode: screen
    layout_policy: *layout_policy
    steps:
      - action: close_transients
      - action: open_processing_algorithm_dialog
        algorithm: gdal:merge
        parameters:
          INPUT:
            - MDT25 full 0472
            - MDT25 full 0473
          PCT: false
          SEPARATE: false
          NODATA_INPUT: -32767
          NODATA_OUTPUT: -32767
      - action: wait
        ms: 600
    target:
      object_name: "unaltracapturaProcessingDialog:gdal:merge"
      fallback:
        - class_name: AlgorithmDialog
    drawings:
      - type: callout
        text: MDT25 0472 + MDT25 0473
        colour: auto
        number: 1
        number_style: label
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: false
        target:
          object_name: "unaltracapturaProcessingParameter:INPUT"
      - type: callout
        text: Desplega per comprovar el NoData
        colour: auto
        number: 2
        number_style: label
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: true
        target:
          object_name: grpAdvanced
    output:
      path: assets/img/qgis/qgis-raster-merge-dialog.png
      annotations_svg: assets/img/qgis/qgis-raster-merge-dialog.annotations.svg
      manifest: assets/img/qgis/qgis-raster-merge-dialog.manifest.yml

  - id: clip-menu
    title: Ruta de menú per retallar amb una màscara
    mode: window
    layout_policy: *layout_policy
    steps:
      - action: close_transients
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/terrain/vila-seca/mdt25_0472_0473_mosaic.tif
        name: Mosaic MDT25 · 25 m
      - action: show_panel
        title: Layers
      - action: open_menu_path
        path:
          - Ràster
          - Extraction
          - Retalla ràster per capa màscara...
      - action: wait
        ms: 500
    target: *main_window
    drawings:
      - type: callout
        text: Retalla per màscara
        colour: auto
        number: none
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: true
        target:
          class_name: QAction
          text: Retalla ràster per capa màscara
    output:
      path: assets/img/qgis/qgis-raster-clip-menu.png
      annotations_svg: assets/img/qgis/qgis-raster-clip-menu.annotations.svg
      manifest: assets/img/qgis/qgis-raster-clip-menu.manifest.yml

  - id: clip-dialog
    title: Retallar el mosaic pel límit municipal
    mode: screen
    layout_policy: *layout_policy
    steps:
      - action: close_transients
      - action: open_processing_algorithm_dialog
        algorithm: gdal:cliprasterbymasklayer
        parameters:
          INPUT: Mosaic MDT25 · 25 m
          MASK: Límit de Vila-seca
          NODATA: -32767
          CROP_TO_CUTLINE: true
          KEEP_RESOLUTION: true
      - action: wait
        ms: 600
    target:
      object_name: "unaltracapturaProcessingDialog:gdal:cliprasterbymasklayer"
      fallback:
        - class_name: AlgorithmDialog
    drawings:
      - type: callout
        text: Mosaic d'entrada
        colour: auto
        number: 1
        number_style: label
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: false
        target:
          object_name: "unaltracapturaProcessingParameter:INPUT"
      - type: callout
        text: "NoData de sortida: -32767"
        colour: auto
        number: 2
        number_style: label
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: false
        target:
          object_name: "unaltracapturaProcessingParameter:NODATA"
    output:
      path: assets/img/qgis/qgis-raster-clip-dialog.png
      annotations_svg: assets/img/qgis/qgis-raster-clip-dialog.annotations.svg
      manifest: assets/img/qgis/qgis-raster-clip-dialog.manifest.yml

  - id: mdt25-vila-seca
    title: Vila-seca al MDT25
    mode: window
    layout_policy: *layout_policy
    steps:
      - action: close_transients
      - action: show_panel
        title: Layers
      - action: set_layer_visible
        layer: MDT25 full 0472
        visible: false
      - action: set_layer_visible
        layer: MDT25 full 0473
        visible: false
      - action: set_layer_visible
        layer: Mosaic MDT25 · 25 m
        visible: false
      - action: set_layer_visible
        layer: Ortofoto Territorial ICGC 2025
        visible: false
      - action: set_layer_visible
        layer: MDT200 Vila-seca · 200 m
        visible: false
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/terrain/vila-seca/mdt25_vila_seca.tif
        name: MDT25 Vila-seca · 25 m
      - action: style_raster
        layer: MDT25 Vila-seca · 25 m
        nodata: -32767
        minimum: 0
        maximum: 80
        palette: terrain
        opacity: 1.0
        unit: m
      - action: zoom_to_layer
        layer: Límit de Vila-seca
        scale: 1.0
      - action: wait
        ms: 200
      - action: set_canvas_scale
        scale: 40000
      - action: expand_tree_item
        item_text: MDT25 Vila-seca · 25 m
      - action: select_layer
        layer: MDT25 Vila-seca · 25 m
      - action: wait
        ms: 600
    target: *main_window
    drawings: []
    output:
      path: assets/img/qgis/qgis-raster-mdt25-vila-seca.png
      annotations_svg: assets/img/qgis/qgis-raster-mdt25-vila-seca.annotations.svg
      manifest: assets/img/qgis/qgis-raster-mdt25-vila-seca.manifest.yml

  - id: mdt200-vila-seca
    title: Vila-seca al MDT200
    mode: window
    layout_policy: *layout_policy
    steps:
      - action: show_panel
        title: Layers
      - action: set_layer_visible
        layer: MDT25 Vila-seca · 25 m
        visible: false
      - action: select_layer
        layer: Límit de Vila-seca
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/terrain/vila-seca/mdt200_vila_seca.tif
        name: MDT200 Vila-seca · 200 m
      - action: set_layer_visible
        layer: MDT200 Vila-seca · 200 m
        visible: true
      - action: style_raster
        layer: MDT200 Vila-seca · 200 m
        nodata: -32767
        minimum: 0
        maximum: 80
        palette: terrain
        opacity: 1.0
        unit: m
      - action: zoom_to_layer
        layer: Límit de Vila-seca
        scale: 1.0
      - action: wait
        ms: 200
      - action: set_canvas_scale
        scale: 40000
      - action: expand_tree_item
        item_text: MDT200 Vila-seca · 200 m
      - action: select_layer
        layer: MDT200 Vila-seca · 200 m
      - action: wait
        ms: 600
    target: *main_window
    drawings: []
    output:
      path: assets/img/qgis/qgis-raster-mdt200-vila-seca.png
      annotations_svg: assets/img/qgis/qgis-raster-mdt200-vila-seca.annotations.svg
      manifest: assets/img/qgis/qgis-raster-mdt200-vila-seca.manifest.yml

  - id: slope-menu
    title: Eina de pendent al menú Ràster
    mode: window
    layout_policy: *layout_policy
    steps:
      - action: set_layer_visible
        layer: MDT200 Vila-seca · 200 m
        visible: false
      - action: set_layer_visible
        layer: MDT25 Vila-seca · 25 m
        visible: true
      - action: select_layer
        layer: MDT25 Vila-seca · 25 m
      - action: show_panel
        title: Layers
      - action: open_menu_path
        path:
          - Ràster
          - Analysis
          - Pendent…
      - action: wait
        ms: 500
    target: *main_window
    drawings:
      - type: callout
        text: Eina Pendent
        colour: auto
        number: none
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: true
        target:
          class_name: QAction
          text: Pendent
    output:
      path: assets/img/qgis/qgis-raster-slope-menu.png
      annotations_svg: assets/img/qgis/qgis-raster-slope-menu.annotations.svg
      manifest: assets/img/qgis/qgis-raster-slope-menu.manifest.yml

  - id: slope-degrees
    title: Pendent del MDT25 en graus
    mode: window
    layout_policy: *layout_policy
    steps:
      - action: close_transients
      - action: show_panel
        title: Layers
      - action: set_layer_visible
        layer: MDT25 Vila-seca · 25 m
        visible: false
      - action: select_layer
        layer: Límit de Vila-seca
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/terrain/vila-seca/pendent_25m_graus_vila_seca.tif
        name: Pendent MDT25 · graus
      - action: style_raster
        layer: Pendent MDT25 · graus
        nodata: -32767
        minimum: 0
        maximum: 15
        palette: viridis
        opacity: 1.0
        unit: °
      - action: zoom_to_layer
        layer: Límit de Vila-seca
        scale: 1.0
      - action: wait
        ms: 200
      - action: set_canvas_scale
        scale: 40000
      - action: select_layer
        layer: Pendent MDT25 · graus
      - action: wait
        ms: 600
    target: *main_window
    drawings: []
    output:
      path: assets/img/qgis/qgis-raster-slope-degrees.png
      annotations_svg: assets/img/qgis/qgis-raster-slope-degrees.annotations.svg
      manifest: assets/img/qgis/qgis-raster-slope-degrees.manifest.yml

  - id: slope-percent
    title: Pendent del MDT25 en percentatge
    mode: window
    layout_policy: *layout_policy
    steps:
      - action: show_panel
        title: Layers
      - action: set_layer_visible
        layer: Pendent MDT25 · graus
        visible: false
      - action: select_layer
        layer: Límit de Vila-seca
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/terrain/vila-seca/pendent_25m_percent_vila_seca.tif
        name: Pendent MDT25 · percentatge
      - action: style_raster
        layer: Pendent MDT25 · percentatge
        nodata: -32767
        minimum: 0
        maximum: 26
        palette: viridis
        opacity: 1.0
        unit: "%"
      - action: zoom_to_layer
        layer: Límit de Vila-seca
        scale: 1.0
      - action: wait
        ms: 200
      - action: set_canvas_scale
        scale: 40000
      - action: select_layer
        layer: Pendent MDT25 · percentatge
      - action: wait
        ms: 600
    target: *main_window
    drawings: []
    output:
      path: assets/img/qgis/qgis-raster-slope-percent.png
      annotations_svg: assets/img/qgis/qgis-raster-slope-percent.annotations.svg
      manifest: assets/img/qgis/qgis-raster-slope-percent.manifest.yml

  - id: calculator-menu
    title: Calculadora ràster del menú Ràster
    mode: window
    layout_policy: *layout_policy
    steps:
      - action: close_transients
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/terrain/vila-seca/mdt25_vila_seca.tif
        name: elevacio
      - action: load_raster
        path: tmp/unaltracaptura-qgis/cache/prepared/terrain/vila-seca/pendent_25m_graus_vila_seca.tif
        name: pendent_graus
      - action: show_panel
        title: Layers
      - action: open_menu_path
        path:
          - Ràster
          - Calculadora ràster…
      - action: wait
        ms: 500
    target: *main_window
    drawings:
      - type: callout
        text: Calculadora ràster
        colour: auto
        number: none
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: true
        target:
          class_name: QAction
          text: Calculadora ràster
    output:
      path: assets/img/qgis/qgis-raster-calculator-menu.png
      annotations_svg: assets/img/qgis/qgis-raster-calculator-menu.annotations.svg
      manifest: assets/img/qgis/qgis-raster-calculator-menu.manifest.yml

  - id: calculator-boolean
    title: Expressió booleana a la Calculadora ràster de Processament
    mode: screen
    layout_policy: *layout_policy
    steps:
      - action: close_transients
      - action: open_processing_algorithm_dialog
        algorithm: native:rastercalc
        parameters:
          LAYERS:
            - elevacio
            - pendent_graus
          EXPRESSION: '("elevacio@1" < 20) AND ("pendent_graus@1" < 2)'
          EXTENT: elevacio
          CELL_SIZE: 25
          CRS: EPSG:25831
      - action: wait
        ms: 600
    target:
      object_name: "unaltracapturaProcessingDialog:native:rastercalc"
      fallback:
        - class_name: AlgorithmDialog
    drawings:
      - type: callout
        text: "Capes: elevacio + pendent_graus"
        colour: auto
        number: 1
        number_style: label
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: true
        target:
          object_name: "unaltracapturaProcessingParameter:LAYERS"
      - type: callout
        text: Predicats amb AND
        colour: auto
        number: 2
        number_style: label
        target_marker: box
        label_topology: outside
        placement: above
        leader: true
        target:
          object_name: "unaltracapturaProcessingParameter:EXPRESSION"
      - type: callout
        text: "Graella: elevacio · 25 m · EPSG:25831"
        colour: auto
        number: 3
        number_style: label
        target_marker: box
        label_topology: edge
        placement: bottom_right
        leader: true
        target:
          object_name: "unaltracapturaProcessingParameter:EXTENT"
    output:
      path: assets/img/qgis/qgis-raster-calculator-boolean.png
      annotations_svg: assets/img/qgis/qgis-raster-calculator-boolean.annotations.svg
      manifest: assets/img/qgis/qgis-raster-calculator-boolean.manifest.yml

  - id: aspect-sectors
    title: Sectors d'orientació del MDT25
    mode: window
    layout_policy: *layout_policy
    steps:
      - action: close_transients
      - action: show_panel
