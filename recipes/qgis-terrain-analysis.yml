  - id: vila-seca-slope-degrees
    type: raster
    path: prepared/terrain/vila-seca/pendent_25m_graus_vila_seca.tif
    sha256: 39b479da22f1c27048d38bed340d9ebcbd0f2afd695cf2aa632462d839aebd06
  - id: vila-seca-slope-percent
    type: raster
