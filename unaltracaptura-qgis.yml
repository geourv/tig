  - id: cnig-mdt05-0473
    kind: downloadable
    provider: cnig
    type: raster
    title: MDT05 de primera cobertura, full 0473
    description: COG oficial de 5 metres de l'IGN/CNIG que cobreix Vila-seca i conserva NoData sobre les zones sense cota vàlida.
    url: https://centrodedescargas.cnig.es/CentroDescargas/detalleArchivo?sec=9072569
    licence: CC BY 4.0 ign.es
    size: medium
    formats: [cog, geotiff]
    tags: [vilaseca, dem, mdt, elevation, nodata, raster, cnig, cog]
    teaching_use:
      - Distingir cotes zero de cel·les NoData amb una font oficial.
      - Inspeccionar resolució, rang, referència vertical i cobertura abans de calcular derivats.
    layers:
      - name: mdt05_0473
        title: MDT05 0473
        geometry: raster
        crs: EPSG:25831
    preparation:
      - id: download_cnig_mdt05_0473
        operation: download
        description: Descarrega el COG oficial MDT05 del full 0473 mitjançant el formulari declarat pel CNIG.
        area: vila_seca
        downloads:
          - id: pnoa_mdt05_etrs89_hu31_0473_lid
            description: MDT05 de primera cobertura, full MTN50 0473, ETRS89 UTM 31N i altures ortomètriques.
            url: https://centrodedescargas.cnig.es/CentroDescargas/descargaDir
            method: POST
            form:
              secDescDirLA: "9072569"
              secuencial: "9072569"
              codSerie: MDT05
            output: prepared/cnig/mdt05/source/pnoa_mdt05_etrs89_hu31_0473_lid.tif
            sha256: 27f9112c036be5923d458a1b5fb4da646aba091a325d262dd03ed13eb0ce1c3d
            max_bytes: 30000000
        outputs:
          - prepared/cnig/mdt05/source/pnoa_mdt05_etrs89_hu31_0473_lid.tif
        tools: [cnig:download-centre]
        steps:
          - Utilitzar exclusivament el recurs 9072569 del centre de descàrregues oficial.
          - Verificar la mida i el SHA-256 abans d'utilitzar el COG.
          - Conservar la descàrrega a la memòria cau, fora dels fitxers versionats.

